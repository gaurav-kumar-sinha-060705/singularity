# Render Blueprint — deploy via "New +" → "Blueprint" after connecting this repo.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: singularity
    runtime: docker
    plan: free # switch to `starter` ($7/mo) for always-on — registries re-crawl weekly
              # and strip verified badges from sleeping free instances
    healthCheckPath: /health
    envVars:
      # Render injects RENDER_EXTERNAL_URL automatically; the MCP host allowlist
      # and OAuth issuer base pick it up at boot (see app/config.py).
      - key: SINGULARITY_DATABASE_URL
        sync: false # set in dashboard: postgresql+psycopg://...supabase.co:5432/postgres?sslmode=require
      - key: SINGULARITY_RATE_LIMIT_PER_MIN
        value: "300"

      # --- Hosted MCP remote OAuth (optional — set in dashboard) ---
      # Needed for providers that only support OAuth token auth (not API-key):
      # - key: SINGULARITY_STRIPE_CLIENT_ID
      #   sync: false
      # - key: SINGULARITY_STRIPE_CLIENT_SECRET
      #   sync: false
      # - key: SINGULARITY_GITHUB_CLIENT_ID
      #   sync: false
      # - key: SINGULARITY_GITHUB_CLIENT_SECRET
      #   sync: false
      # - key: SINGULARITY_NOTION_CLIENT_ID
      #   sync: false
      # - key: SINGULARITY_NOTION_CLIENT_SECRET
      #   sync: false
      # - key: SINGULARITY_SLACK_CLIENT_ID
      #   sync: false
      # - key: SINGULARITY_SLACK_CLIENT_SECRET
      #   sync: false
      # - key: SINGULARITY_GOOGLE_CLIENT_ID
      #   sync: false
      # - key: SINGULARITY_GOOGLE_CLIENT_SECRET
      #   sync: false
